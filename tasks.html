<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            Tasks & Checklists
        </h1>

    </div>

    <button id="createTaskBtn"
            class="btn text-white fw-semibold"
            style="background-color: #4f35f3; border-radius: 8px; padding: 10px 20px;">
        + Create Task
    </button>

</div>

<div class="card border-0 p-4" style="background-color: #0d122e; border-radius: 12px;">
  <h5 class="fw-bold text-white mb-4">Pending Tasks</h5>
  
  <div id="tasksContainer" class="d-flex flex-column gap-3">
   
    <div class="d-flex align-items-center gap-3 pb-3" style="border-bottom: 1px solid rgba(99, 108, 147, 0.1);">
      <input type="checkbox" class="form-check-input bg-dark border-secondary m-0" checked style="width: 20px; height: 20px;">
      <div>
        <h6 class="fw-bold text-white m-0 text-decoration-line-through" style="opacity: 0.6;">Fix Sidebar Responsiveness</h6>
        <small style="color: #636c93;">Assigned to: Ahmed Ali</small>
      </div>
    </div>

    
    <div class="d-flex align-items-center gap-3 pb-3" style="border-bottom: 1px solid rgba(99, 108, 147, 0.1);">
      <input type="checkbox" class="form-check-input bg-dark border-secondary m-0" style="width: 20px; height: 20px;">
      <div>
        <h6 class="fw-bold text-white m-0">Connect Database APIs</h6>
        <small style="color: #636c93;">Assigned to: Mohamed Wahid</small>
      </div>
    </div>
  </div>
</div>

<!-- Create Task Modal -->
<div class="modal fade" id="createTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Create Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="taskForm">

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Task Name</label>
                        <input type="text" id="taskName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Assigned To</label>
                        <input type="text" id="taskAssigned" class="form-control" required>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" class="btn text-white"
                            style="background-color: #4f35f3;">
                        Create Task
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</body>
</html>
