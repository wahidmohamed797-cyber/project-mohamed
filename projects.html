<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="../index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            Projects Portfolio
        </h1>

    </div>

    <button id="addProjectBtn"
            class="btn text-white fw-semibold"
            style="background-color: #4f35f3; border-radius: 8px; padding: 10px 20px;">
        + New Project
    </button>

</div>
<div id="projectsContainer" class="row g-4">
  
  <div class="col-md-6 col-lg-4">
    <div class="card border-0 p-4 h-100" style="background-color: #0d122e; border-radius: 12px;">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 class="fw-bold text-white m-0">HR Management System</h5>
        <span class="badge" style="background-color: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3);">Completed</span>
      </div>
      <p style="color: #636c93; font-size: 14px;">Client: Mohamed Wahid</p>
      <div class="mt-4">
        <div class="d-flex justify-content-between text-white mb-2" style="font-size: 13px;">
          <span style="color: #636c93;">Progress</span>
          <span class="fw-bold">100%</span>
        </div>
        <div class="progress" style="height: 6px; background-color: #070b1e;">
          <div class="progress-bar" role="progressbar" style="width: 100%; background-color: #10b981;"></div>
        </div>
      </div>
    </div>
  </div>

  
  <div class="col-md-6 col-lg-4">
    <div class="card border-0 p-4 h-100" style="background-color: #0d122e; border-radius: 12px;">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 class="fw-bold text-white m-0">Sales Dashboard Design</h5>
        <span class="badge" style="background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3);">In Progress</span>
      </div>
      <p style="color: #636c93; font-size: 14px;">Client: Ahmed Ali</p>
      <div class="mt-4">
        <div class="d-flex justify-content-between text-white mb-2" style="font-size: 13px;">
          <span style="color: #636c93;">Progress</span>
          <span class="fw-bold">45%</span>
        </div>
        <div class="progress" style="height: 6px; background-color: #070b1e;">
          <div class="progress-bar" role="progressbar" style="width: 45%; background-color: #4f35f3;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New Project Modal -->
<div class="modal fade" id="newProjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="projectForm">

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Project Name</label>
                        <input type="text" id="projectName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Client Name</label>
                        <input type="text" id="projectClient" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Progress (%)</label>
                        <input type="number" id="projectProgress" class="form-control"
                               min="0" max="100" value="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="projectStatus" class="form-select" required>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" class="btn text-white"
                            style="background-color: #4f35f3;">
                        Add Project
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</body>
</html>
