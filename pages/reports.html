<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../style.css">
    <script>document.documentElement.classList.add("auth-checking", "app-loading");</script>
</head>
<body>
  <div class="mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="../index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            Analytics & Reports
        </h1>

    </div>

</div>

<div class="row g-4 mb-4">

    <div class="col-md-6 col-lg-3">
        <div class="card border-0 p-4 report-card">
            <span class="report-label">Total Projects</span>
            <h2 id="reportTotalProjects" class="fw-bold text-white my-2">0</h2>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card border-0 p-4 report-card">
            <span class="report-label">Completed</span>
            <h2 id="reportCompletedProjects" class="fw-bold text-white my-2">0</h2>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card border-0 p-4 report-card">
            <span class="report-label">In Progress</span>
            <h2 id="reportInProgressProjects" class="fw-bold text-white my-2">0</h2>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card border-0 p-4 report-card">
            <span class="report-label">Average Progress</span>
            <h2 id="reportAverageProgress" class="fw-bold text-white my-2">0%</h2>
        </div>
    </div>

</div>

<div class="row g-4 mb-4">

    <div class="col-md-6">
        <div class="card border-0 p-4 report-card">
            <span class="report-label">Total Tasks</span>
            <h2 id="reportTotalTasks" class="fw-bold text-white my-2">0</h2>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card border-0 p-4 report-card">
            <span class="report-label">Assigned Tasks</span>
            <h2 id="reportAssignedTasks" class="fw-bold text-white my-2">0</h2>
        </div>
    </div>

</div>
<div class="card border-0 p-4 report-card">

    <h5 class="fw-bold text-white mb-4">
        Team Activity
    </h5>

    <div id="teamActivityReport"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="../auth.js"></script>
<script src="../app-v2.js"></script>
</body>
</html>
