<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settinges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../style.css">
    <script>document.documentElement.classList.add("auth-checking", "app-loading");</script>
</head>
<body class="settings-page">
<div class="mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="../index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            System Settings
        </h1>

    </div>

</div>

<div class="card settings-card border-0 p-4">
  <h5 class="fw-bold text-white mb-4">System Preferences</h5>

  <div class="settings-option d-flex justify-content-between align-items-center py-3">
    <div>
      <h6 class="fw-bold text-white m-0">Dark Mode Theme</h6>
      <small class="settings-description">Enable or disable dark user interface</small>
    </div>
    <div class="form-check form-switch m-0">
      <input id="darkModeToggle" class="form-check-input" type="checkbox" checked style="width: 45px; height: 24px; cursor: pointer;">
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center py-3">
    <div>
      <h6 class="fw-bold text-white m-0">Email Notifications</h6>
      <small class="settings-description">Receive a summary report daily</small>
    </div>
    <div class="form-check form-switch m-0">
      <input class="form-check-input" type="checkbox" checked style="width: 45px; height: 24px; cursor: pointer;">
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="../auth.js"></script>
<script src="../app-v2.js"></script>
</body>
</html>
