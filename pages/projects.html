<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../style.css">
    <script>document.documentElement.classList.add("auth-checking", "app-loading");</script>
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="../index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            Projects Portfolio
        </h1>

    </div>

    <button id="addProjectBtn"
            class="btn text-white fw-semibold"
            style="background-color: #4f35f3; border-radius: 8px; padding: 10px 20px;">
        + New Project
    </button>

</div>
<div id="projectsContainer" class="row g-4">

</div>

<!-- New Project Modal -->
<div class="modal fade" id="newProjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="projectForm">

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Project Name</label>
                        <input type="text" id="projectName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Client (Optional)</label>
                        <select id="projectClient" class="form-select">
                            <option value="">No client</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Progress (%)</label>
                        <input type="number" id="projectProgress" class="form-control"
                               min="0" max="100" value="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="projectStatus" class="form-select" required>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" class="btn text-white"
                            style="background-color: #4f35f3;">
                        Add Project
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="../auth.js"></script>
<script src="../app-v2.js"></script>
</body>
</html>
