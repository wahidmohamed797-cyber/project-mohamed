<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="../index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            Admin Profile
        </h1>

    </div>

</div>

<div class="card border-0 p-4"
     style="background-color: #0d122e; border-radius: 12px; max-width: 650px;">

    <h5 class="fw-bold text-white mb-4">
        Account Settings
    </h5>

    <form>

        <div class="mb-3">
            <label class="form-label fw-medium"
                   style="color: #636c93;">
                Full Name
            </label>

            <input type="text"
                   class="form-control text-white border-0 py-2.5"
                   value="Tech Flow Admin"
                   style="background-color: #070b1e; border-radius: 8px;">
        </div>

        <div class="mb-4">
            <label class="form-label fw-medium"
                   style="color: #636c93;">
                Email Address
            </label>

            <input type="email"
                   class="form-control text-white border-0 py-2.5"
                   value="admin@techflow.com"
                   style="background-color: #070b1e; border-radius: 8px;">
        </div>

        <button type="submit"
                class="btn text-white fw-semibold"
                style="background-color: #4f35f3; border-radius: 8px; padding: 10px 25px;">
            Save Changes
        </button>

    </form>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../main.js"></script>
</body>
</html>
