<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-4">

    <div class="d-flex align-items-center gap-3">

        <a href="../index.html"
           class="text-white text-decoration-none fs-4"
           title="Back to Dashboard">
            <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h2 fw-bold text-white m-0">
            Customers Database
        </h1>

    </div>

    <button id="addCustomerBtn"
            class="btn text-white fw-semibold"
            style="background-color: #4f35f3; border-radius: 8px; padding: 10px 20px;">
        + Add Customer
    </button>

</div>
<div class="card border-0 p-4" style="background-color: #0d122e; border-radius: 12px;">
  <h5 class="fw-bold text-white mb-4">Client Overview</h5>
  <div class="table-responsive">
    <table class="table table-dark table-hover m-0"
     style="--bs-table-bg: transparent; border-color: rgba(99, 108, 147, 0.1);">
      <thead>
        <tr style="color: #636c93;">
          <th class="py-3">Client Name</th>
          <th class="py-3">Company</th>
          <th class="py-3">Email</th>
          <th class="py-3">Total Projects</th>
          <th class="py-3">Actions</th>
        </tr>
      </thead>
      <tbody id="customersTableBody" class="text-white">
        <tr data-email="omar@techvibe.com">
          <td class="py-3 align-middle">Omar Ibrahim</td>
          <td class="py-3 align-middle" style="color: #636c93;">TechVibe Solutions</td>
          <td class="py-3 align-middle" style="color: #636c93;">omar@techvibe.com</td>
          <td class="py-3 align-middle">3 Projects</td>
          <td class="py-3 align-middle">
            <button class="delete-customer-btn btn btn-sm text-danger"
            title="Delete Customer">
               <i class="bi bi-trash"></i>
            </button>
          </td>

        </tr>
        <tr data-email="sara.m@pixelcraft.com">
          <td class="py-3 align-middle">Sara Mohamed</td>
          <td class="py-3 align-middle" style="color: #636c93;">PixelCraft Agency</td>
          <td class="py-3 align-middle" style="color: #636c93;">sara.m@pixelcraft.com</td>
          <td class="py-3 align-middle">1 Project</td>
          <td class="py-3 align-middle">
             <button class="delete-customer-btn btn btn-sm text-danger"
            title="Delete Customer">
                <i class="bi bi-trash"></i>
             </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Customer Modal -->
<div class="modal fade" id="addCustomerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="customerForm">

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Client Name</label>
                        <input type="text" id="customerName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input type="text" id="customerCompany" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="customerEmail" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Projects</label>
                        <input type="number" id="customerProjects" class="form-control" min="0" required>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" class="btn text-white" style="background-color: #4f35f3;">
                        Add Customer
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="../main.js"></script> 
</body>
</html>
